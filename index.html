<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#edf1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1110" media="(prefers-color-scheme: dark)">
<meta name="description" content="Kalendarz dyżurów dentysty w kilku gabinetach: dni pracy, kursy, przychód brutto i netto, ZUS i podatek (skala, ryczałt).">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grafik">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Grafik Gabinetów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: sticky header + tab rail → calendar grid with a docked day panel (side column ≥1080px, bottom sheet below). Monochrome ink UI; colour belongs only to the clinics (validated categorical slots). */
  --bg:#edf1f0;--surface:#ffffff;--surface-2:#f5f8f7;--sunken:#e3e9e7;
  --ink:#0f1f1a;--ink-2:#42524c;--muted:#6a7873;--line:#d7dfdc;--line-2:#b8c4c0;
  --focus:#2a78d6;--scrim:rgba(8,16,13,.42);
  --good-text:#0b6b2a;--good-bg:#e2f3e5;--warn:#eda100;--warn-text:#734d00;--warn-bg:#fff1cf;--crit:#d03b3b;--crit-text:#a82626;--crit-bg:#fbe4e4;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
  --font-display:"Bricolage Grotesque","Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(15,31,26,.05),0 12px 32px rgba(15,31,26,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1110;--surface:#131a18;--surface-2:#171f1c;--sunken:#0e1513;
  --ink:#e8efec;--ink-2:#b3c0bb;--muted:#8a9892;--line:#25302c;--line-2:#3a4842;
  --focus:#3987e5;--scrim:rgba(0,0,0,.6);
  --good-text:#5ad884;--good-bg:#10281a;--warn:#c98500;--warn-text:#f6c45a;--warn-bg:#2b2210;--crit:#e66767;--crit-text:#f29a9a;--crit-bg:#301616;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1110;--surface:#131a18;--surface-2:#171f1c;--sunken:#0e1513;
  --ink:#e8efec;--ink-2:#b3c0bb;--muted:#8a9892;--line:#25302c;--line-2:#3a4842;
  --focus:#3987e5;--scrim:rgba(0,0,0,.6);
  --good-text:#5ad884;--good-bg:#10281a;--warn:#c98500;--warn-text:#f6c45a;--warn-bg:#2b2210;--crit:#e66767;--crit-text:#f29a9a;--crit-bg:#301616;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:1360px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.015em;text-wrap:balance;margin:0}
p{margin:0}
.tn,table{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.strong{font-weight:700}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px 14px;padding-top:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:21px;font-weight:760;font-variation-settings:"opsz" 28}
.logo{flex:none}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 9px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="saved"] i{background:var(--good-text)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="error"] i,.sync[data-s="error"]{color:var(--crit-text)}
.sync[data-s="error"] i{background:var(--crit)}
.sync[data-s="demo"]{background:var(--warn-bg);color:var(--warn-text);border-color:transparent}
.sync[data-s="demo"] i{background:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px 11px;font-weight:600;font-size:14.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--warn-bg);color:var(--warn-text);font-size:11.5px;font-weight:700}
.demo-bar{background:var(--warn-bg);color:var(--warn-text);font-weight:600;font-size:13.5px}
.demo-bar .shell{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap}

/* main + generic */
.main{padding-block:18px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card>h3,.card-h{font-size:17px;font-weight:700;margin-bottom:12px}
.card-hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-hrow h3{font-size:17px;font-weight:700}
.stack{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--surface))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--crit-text);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{appearance:none;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.icon-btn:hover{background:var(--surface-2)}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;padding:5px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.pill.done{background:var(--good-bg);color:var(--good-text)}
.pill.todo,.pill.warn{background:var(--warn-bg);color:var(--warn-text)}
.pill.cancelled{color:var(--muted);text-decoration:line-through}
.pill.crit{background:var(--crit-bg);color:var(--crit-text)}
.pill.est{background:transparent;border:1px dashed var(--line-2);color:var(--muted);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cc,var(--muted));flex:none}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13.5px;color:var(--ink-2)}
.note b{color:var(--ink)}
.note.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn-text)}
.note.warn b{color:inherit}
.note.crit{background:var(--crit-bg);border-color:transparent;color:var(--crit-text)}
.note.crit b{color:inherit}
details.more>summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);padding:4px 0}
details.more[open]>summary{margin-bottom:8px}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
label.f .hint{font-weight:500;color:var(--muted);font-size:12px}
label.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--ink)}
input[type=text],input[type=date],input[type=time],input[type=month],input[type=number],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;min-height:40px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
input::placeholder{color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
@media (max-width:640px){input[type=text],input[type=date],input[type=time],input[type=month],input[type=number],select{font-size:16px}}

/* calendar layout */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1080px){.cal-wrap.with-panel{grid-template-columns:minmax(0,1fr) 400px}}
.cal-main{display:grid;gap:12px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.mnav{display:flex;align-items:center;gap:6px;margin-right:auto;min-width:0}
.mtitle{font-size:clamp(25px,3.2vw,36px);font-weight:760;font-variation-settings:"opsz" 72;line-height:1.05;padding:0 4px}
.mtitle span{color:var(--muted);font-weight:600}
.kpis{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;font-size:13.5px;color:var(--ink-2)}
.kpis b{color:var(--ink);font-size:16px;font-weight:700}
.goal{display:grid;gap:5px;font-size:13px;color:var(--ink-2)}
.meter{position:relative;height:10px;border-radius:6px;background:var(--sunken);overflow:hidden}
.meter .m-f{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--ink) 28%,var(--sunken));border-radius:6px}
.meter .m-d{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:6px}
.nudges{display:flex;flex-wrap:wrap;gap:8px}
.nudge{display:inline-block;line-height:1.4;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13.5px;color:var(--ink-2);cursor:pointer;text-align:left;max-width:100%}
.nudge b{color:var(--ink)}
.nudge.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn-text)}
.nudge.warn b{color:inherit}
.onb{display:grid;gap:10px}
.onb ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.onb li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.onb .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:inline-grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.onb .ck.ok{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.onb li.ok .t{color:var(--muted);text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);align-items:center}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--cc)}

/* agenda */
.agenda{display:grid;gap:16px}
.ag-day{display:grid;gap:8px}
.ag-day h4{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ag-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:12px;background:var(--surface)}
.ag-main{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;min-width:0}
.ag-amt{font-weight:700;text-align:right;white-space:nowrap}
.qf{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.qf label.f{width:130px}
.empty{border:1px dashed var(--line-2);border-radius:14px;padding:22px;text-align:center;color:var(--ink-2);display:grid;gap:10px;justify-items:center}

/* day panel */
.day-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1080px){.day-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);max-height:calc(100vh - 128px);overflow:auto}}
.day-panel.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;border-bottom:0;padding-top:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow);animation:up .2s ease-out}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .2s}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dp-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dp-head h3{font-size:22px;font-weight:740;font-variation-settings:"opsz" 40}
.scards{display:grid;gap:10px}
.scard{border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.sc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sc-top b{font-size:15px}
.sc-money{font-size:13.5px;color:var(--ink-2)}
.sc-money b{color:var(--ink)}
.sc-act{display:flex;gap:6px;flex-wrap:wrap}
.editor{display:grid;gap:12px;border:1px solid var(--line-2);border-radius:14px;padding:14px;background:var(--surface-2)}
.editor h4{font-size:16px}
.clinic-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.clinic-pick button{appearance:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;text-align:left;min-width:0}
.clinic-pick button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clinic-pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:13.5px;color:var(--ink-2)}
.calc .big{font-size:24px;font-weight:700;color:var(--ink)}
.calc-split{display:flex;gap:6px 16px;flex-wrap:wrap}
.calc-split b{color:var(--ink)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crit-bg);color:var(--crit-text);border-radius:10px;padding:8px 10px;font-weight:600;font-size:13.5px}
.offsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}

/* summary */
.hero-card{display:grid;gap:14px}
.hero{font-size:clamp(42px,6vw,60px);font-weight:700;letter-spacing:-.025em;line-height:1}
.hero-sub{font-size:14.5px;color:var(--ink-2)}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface)}
.split span{display:block;height:100%;min-width:3px}
.split-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;font-size:13px}
.split-legend div{display:flex;gap:7px;align-items:baseline}
.split-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;align-self:center}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--line-2)}
.tbl tr.dim td{color:var(--muted)}
.tbl tr.total td{font-weight:700}
.tbl td input{min-width:110px}
.tbl .neg{color:var(--ink-2)}
.chart{position:relative;width:100%;min-height:40px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--font-body)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow);max-width:260px;font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:2px}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.alert-list{display:grid;gap:8px}

/* deadlines */
.dl-list{display:grid;gap:8px}
.dl-month{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:10px}
.dl{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.dl.done{opacity:.55}
.dl.over{border-color:color-mix(in srgb,var(--crit) 50%,var(--line));background:color-mix(in srgb,var(--crit-bg) 60%,var(--surface))}
.dl-date{display:grid;justify-items:center;line-height:1.1;border-right:1px solid var(--line);padding-right:10px}
.dl-date b{font-size:20px;font-family:var(--font-display)}
.dl-date span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.05em}
.dl-body{display:grid;gap:2px;min-width:0}
.dl-body b{font-size:14.5px}
.dl-side{display:grid;justify-items:end;gap:4px;text-align:right}
.dl-side .amt{font-weight:700;white-space:nowrap}

/* compare */
.cmp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.cmp-card{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--surface)}
.cmp-card.best{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cmp-card h4{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.cmp-card .net{font-size:28px;font-weight:700;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:13.5px}
.kv span{color:var(--ink-2)}
.kv b{text-align:right;white-space:nowrap;font-weight:600}
input[type=range]{width:100%;accent-color:var(--ink)}

/* settings */
.set-sec{display:grid;gap:12px;scroll-margin-top:130px}
.set-sec>h2{font-size:22px;font-weight:740}
.set-sec>p{color:var(--ink-2);font-size:14px;max-width:70ch}
.clinic-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:14px;align-items:start}
.ccard{border:1px solid var(--line);border-top:4px solid var(--cc);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);cursor:pointer;background:var(--cc)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.zrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.tag-est{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn-text);background:var(--warn-bg);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* modal + toast */
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;width:min(760px,100%);max-height:min(90vh,940px);overflow:auto;padding:20px;box-shadow:var(--shadow);display:grid;gap:16px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h h3{font-size:22px;font-weight:740}
@media (max-width:640px){.modal-wrap{place-items:end stretch;padding:0}.modal{border-radius:18px 18px 0 0;max-height:94vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.tpl-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:12px;padding:10px 12px}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick button{appearance:none;width:42px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;cursor:pointer}
.daypick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* month grid – większa i czytelniejsza */
.mgrid{display:grid}
.mg-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:0 0 8px}
.mg-head>span{padding-left:10px}
.mg-head .wd-s{display:none}
.mg-body{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;container-type:inline-size;container-name:mgrid}
.cell{appearance:none;border:0;background:var(--surface);min-height:136px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;min-width:0;position:relative;color:var(--ink)}
.cell:hover{background:var(--surface-2)}
.cell.we{background:color-mix(in srgb,var(--sunken) 45%,var(--surface))}
.cell.other{background:var(--surface-2)}
.cell.other .dnum,.cell.other .chip{opacity:.55}
.cell.off{background:var(--sunken)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--focus)}
.cell-top{display:flex;align-items:center;gap:6px;min-width:0}
.dnum{font-weight:700;font-size:15px;min-width:28px;height:28px;display:inline-grid;place-items:center;border-radius:999px;flex:none}
.cell.today .dnum{background:var(--ink);color:var(--surface)}
.cell.holiday .dnum{color:var(--crit-text)}
.cell.today.holiday .dnum{color:var(--surface)}
.hname,.offtag{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cell.holiday .hname{color:var(--crit-text);font-weight:600}
.offtag{color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;flex-direction:column;gap:4px;min-width:0}
.chip{display:flex;gap:6px;align-items:center;font-size:13px;line-height:1.3;padding:4px 8px 4px 7px;border-radius:7px;background:color-mix(in srgb,var(--cc) 42%,var(--surface));border-left:4px solid var(--cc);white-space:nowrap;overflow:hidden;min-width:0}
.chip-t{font-weight:800;flex:none;letter-spacing:.01em}
.chip-h{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip-a{margin-left:auto;padding-left:4px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.chip.planned{background:color-mix(in srgb,var(--cc) 20%,var(--surface))}
.chip.cancelled{opacity:.5;text-decoration:line-through}
.chip.todo{box-shadow:inset 0 0 0 2px var(--warn)}
.chip.todo .chip-a{color:var(--warn-text);font-weight:700}
.dsum{margin-top:auto;font-size:12px;font-weight:700;color:var(--ink-2);text-align:right}
@container mgrid (max-width:1000px){.chip-a{display:none}}
@container mgrid (max-width:640px){.chip-h,.hname{display:none}.chip{font-size:11.5px;padding:2px 4px;border-left-width:3px}.cell{min-height:84px;padding:5px 4px 6px}}
@media (max-width:700px){
  .cell{min-height:76px;padding:4px 3px 5px;gap:3px}
  .dnum{min-width:23px;height:23px;font-size:13px}
  .chip{font-size:11px;padding:2px 3px;border-left-width:3px;border-radius:5px}
  .chip-h,.chip-a,.hname{display:none}
  .dsum{font-size:10px}.offtag{font-size:9px}
  .mg-head>span{padding-left:4px}
  .mg-head .wd-l{display:none}.mg-head .wd-s{display:inline}
}
@media (max-width:560px){
  .cal-main{gap:10px}
  .mtitle{font-size:22px}
  .nudge{font-size:12.5px;padding:6px 10px}
  .stats{gap:6px}
  .stat{padding:7px 10px}
  .stat-l{font-size:10.5px}
  .stat-s{display:none}
  .seg-lg button{padding:6px 11px}
  .legend-line{font-size:12px}
}

/* liczby nad kalendarzem, filtr, pierwsze kroki */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:1px;min-width:0}
.stat-l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat-v{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.stat-s{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-v{font-size:19px}}
.cfilter{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cf-l{font-size:13px;color:var(--muted);font-weight:600;margin-right:2px}
.cf{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--ink);min-height:34px}
.cf .dot{background:var(--cc)}
.cf-n{color:var(--ink-2);font-weight:500;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cf[aria-pressed="false"]{opacity:.55}
.cf[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--cc)}
@media (max-width:700px){.cf-n{display:none}}
.legend-line{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.onb-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:8px 10px;font-size:13.5px}
.onb-bar .step{appearance:none;border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.onb-bar .step.ok{color:var(--muted);background:transparent;text-decoration:line-through;border-color:var(--line)}
.onb-end{margin-left:auto;display:flex;gap:4px}
.seg-lg button{padding:7px 14px;font-size:14px;min-height:36px}

/* tydzień – siatka godzin; na telefonie przewijana w bok */
.week-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.week{min-width:760px}
.wk-grid{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr))}
.wk-head{position:relative}
.wk-hd{appearance:none;border:0;border-left:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:10px 8px;display:grid;gap:1px;justify-items:start;cursor:pointer;color:var(--ink);text-align:left;min-width:0}
.wk-hd:hover{background:var(--surface-2)}
.wk-hd.we{background:color-mix(in srgb,var(--sunken) 45%,var(--surface))}
.wk-hd .wk-dn{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wk-hd b{font-size:24px;font-family:var(--font-display);line-height:1.1}
.wk-hd.today b{background:var(--ink);color:var(--surface);border-radius:10px;padding:0 8px}
.wk-hd.sel{box-shadow:inset 0 -3px 0 var(--focus)}
.wk-sum{font-size:12.5px;color:var(--ink-2);font-weight:700}
.wk-corner{border-bottom:1px solid var(--line)}
.wk-allday{border-bottom:1px solid var(--line)}
.wk-ad-l{font-size:10.5px;color:var(--muted);padding:6px 4px;text-align:right}
.wk-ad{border-left:1px solid var(--line);padding:5px 6px;display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.wk-ad .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wk-times{position:relative}
.wk-times span{position:absolute;right:8px;font-size:11.5px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wk-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px),var(--line) var(--hh))}
.wk-col.we{background-color:color-mix(in srgb,var(--sunken) 35%,var(--surface))}
.wk-col.hol{background-color:color-mix(in srgb,var(--crit) 6%,var(--surface))}
.wk-col.today{background-color:color-mix(in srgb,var(--focus) 5%,var(--surface))}
.wk-blk{position:absolute;left:4px;right:4px;border-radius:9px;padding:6px 8px;font-size:13px;line-height:1.3;background:color-mix(in srgb,var(--cc) 42%,var(--surface));border:0;border-left:4px solid var(--cc);overflow:hidden;text-align:left;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:1px}
.wk-blk b{font-size:14px;font-weight:800}
.wk-bt{color:var(--ink-2);font-size:12.5px}
.wk-bi{font-weight:700;font-size:13px}
.wk-blk.short{flex-direction:row;align-items:center;gap:6px;padding:3px 6px}
.wk-blk.short .wk-bt{display:none}
.wk-blk.planned{background:color-mix(in srgb,var(--cc) 20%,var(--surface))}
.wk-blk.planned .wk-bi{font-weight:600;color:var(--ink-2)}
.wk-blk.todo{box-shadow:inset 0 0 0 2px var(--warn)}
.wk-blk.todo .wk-bi{color:var(--warn-text)}
.wk-blk.cancelled{opacity:.5;text-decoration:line-through}
.wk-blk:hover{filter:brightness(.97)}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--crit);z-index:2;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--crit)}

/* rok – 12 miesięcy */
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,264px),1fr));gap:14px}
.ymonth{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;display:grid;gap:8px;align-content:start;min-width:0}
.ymonth.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ymonth.dim .yd:not(.today):not(.hol){color:var(--muted)}
.ym-h{appearance:none;border:0;background:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px;cursor:pointer;color:var(--ink);text-align:left;border-radius:8px}
.ym-h:hover{background:var(--surface-2)}
.ym-h b{font-family:var(--font-display);font-size:18px;font-weight:740}
.ym-h span{font-size:13.5px;color:var(--ink);font-weight:700}
.ym-dow,.ym-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.ym-dow span{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700}
.yd{appearance:none;border:0;aspect-ratio:1/1;min-height:30px;width:100%;border-radius:8px;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.yd.blank{cursor:default}
.yd:hover:not(.blank){box-shadow:inset 0 0 0 1px var(--line-2)}
.yd.we{color:var(--ink-2)}
.yd.hol{color:var(--crit-text);font-weight:800}
.yd.off{background:var(--sunken)}
.yd.today{box-shadow:inset 0 0 0 2px var(--ink);font-weight:800}
.yd.todo{box-shadow:inset 0 0 0 2px var(--warn)}
.yd.sel{outline:2px solid var(--focus);outline-offset:1px}
.ym-f{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;padding:0 4px}


/* tydzień: klik w puste miejsce dodaje dyżur o tej godzinie */
.wk-col[data-a]{cursor:pointer}
.wk-ad[data-a]{cursor:pointer}
.wk-ad[data-a]:hover{background:var(--surface-2)}
.wk-ghost{position:absolute;left:4px;right:4px;border-radius:8px;border:1.5px dashed color-mix(in srgb,var(--ink) 40%,transparent);background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink-2);font-size:12px;font-weight:700;padding:3px 8px;pointer-events:none;line-height:1.2;overflow:hidden;white-space:nowrap}
.wk-blk.draft{background:color-mix(in srgb,var(--cc) 10%,var(--surface));border:2px dashed var(--cc);border-left:4px solid var(--cc);cursor:default;pointer-events:none}
/* przewijanie ciągłe: miesiące i tygodnie jeden pod drugim, nagłówek okresu przyklejony pod paskiem aplikacji */
.stack-list{display:grid;gap:26px;min-width:0}
.stack-prev{justify-self:center}
.stack-end{text-align:center;padding:14px 0 40px}
.sblock{display:grid;min-width:0}
.sb-h{position:sticky;top:var(--hdr,0px);z-index:8;background:var(--bg);padding:10px 0 0;display:grid;gap:8px}
.wblock .sb-h{padding-bottom:10px}
.sb-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;min-width:0}
.sb-t{font-size:clamp(21px,2.4vw,27px);font-weight:760;letter-spacing:-.01em;line-height:1.1;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sb-t>span{color:var(--muted);font-weight:650}
.sb-now{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--surface);border-radius:999px;padding:2px 8px;align-self:center}
.sb-s{display:flex;flex-wrap:wrap;align-items:center;gap:2px 16px;font-size:13.5px;color:var(--ink)}
.sb-l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sb-goal{display:inline-flex;align-items:center;gap:6px}
.sb-goal .meter{width:90px;height:6px}
.sblock .mg-head{padding-bottom:6px}
.cell.blank{background:var(--surface-2);cursor:default;min-height:0}
.cell.blank:hover{background:var(--surface-2)}
@media (max-width:560px){.sb-t{font-size:20px}.sb-s{font-size:12.5px;gap:0 10px}.stack-list{gap:18px}}

/* zmiany, dodawanie wielu dni, stały grafik */
.f-lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.f-lbl .hint{font-weight:500;color:var(--muted)}
.preset-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13.5px;cursor:pointer;color:var(--ink);min-height:38px;font-variant-numeric:tabular-nums}
.pchip:hover{background:var(--surface-2)}
.pchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.custom-t{display:inline-flex;align-items:center;gap:6px}
.custom-t input{width:auto;min-width:112px}
.presets{display:grid;gap:6px;container-type:inline-size}
.preset-ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 38px;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.preset-ed input[type=text]{grid-column:1/-1;font-weight:600}
.tg-i{display:none}
.bk-steps{display:grid;gap:18px}
.bk-step h4{font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.bk-num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:12px;font-weight:800;font-family:var(--font-body)}
.bk-cal{display:grid;gap:8px}
.bk-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bk-nav b{font-family:var(--font-display);font-size:19px}
.bk-wd{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.bk-wd .btn{min-width:40px}
.bk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.bk-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0;text-transform:uppercase;letter-spacing:.05em}
.bk-d{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:62px;padding:4px;display:flex;flex-direction:column;gap:2px;align-items:stretch;cursor:pointer;text-align:left;color:var(--ink);min-width:0;font:inherit}
.bk-d:hover{border-color:var(--line-2);background:var(--surface-2)}
.bk-d .n{font-size:13.5px;font-weight:700;padding-left:2px}
.bk-d.we{background:color-mix(in srgb,var(--sunken) 45%,var(--surface))}
.bk-d.hol .n{color:var(--crit-text)}
.bk-d.today .n{text-decoration:underline;text-underline-offset:3px}
.bk-d.blank{visibility:hidden}
.bk-d.picked{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.bk-tag{font-size:10.5px;font-weight:700;line-height:1.35;border-radius:5px;padding:1px 4px;background:color-mix(in srgb,var(--cc) 50%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.bk-ex{display:flex;gap:3px;margin-top:auto;padding:0 2px 1px}
.bk-ex i{width:7px;height:7px;border-radius:50%;background:var(--cc)}
.bk-sum{display:grid;gap:6px;font-size:13.5px;font-variant-numeric:tabular-nums}
.bk-line{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.bk-line .dot{align-self:center}
.slot-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:3px 4px 3px 11px;font-size:13.5px;background:var(--surface);font-variant-numeric:tabular-nums}
.slot button{appearance:none;border:0;background:var(--sunken);border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--ink);font-size:15px;line-height:1}
/* dni pracy: dzień tygodnia × zmiana */

<script id="engine">
var E = (function () {

      linHealthLimit: 'przyjęto limit z 2026'
    }
  };
  var UD458 = { limit: 1064650, surplus17: 1277580 }; // projekt: 250 tys. € i 300 tys. € (kurs 4,2586)
  var MONTHS = ['styczeń', 'luty', 'marzec', 'kwiecień', 'maj', 'czerwiec', 'lipiec', 'sierpień', 'wrzesień', 'październik', 'listopad', 'grudzień'];

  function r2(x) { return Math.round((x + (x >= 0 ? 1 : -1) * 1e-9) * 100) / 100; }

    var k = keys.filter(function (x) { return x <= y; }).pop();
    if (k === undefined) k = keys[0];
    var o = Object.assign({}, PARAMS[k]);
    var ov = (ctx.settings.params || {})[y] || {};
    Object.keys(ov).forEach(function (key) { var v = num(ov[key]); if (v != null) o[key] = v; });
    return o;
  }
  function regimeFor(ctx, y) {
    var r = ctx.settings.regimes || {};
    if (r[y]) return r[y];
    var ys = Object.keys(r).map(Number).filter(function (k) { return k <= y; }).sort(function (a, b) { return b - a; });
    return ys.length ? r[ys[0]] : 'skala';
  }
  function jdgActive(ctx, mk) { var s = ctx.settings.jdgStart; return !!s && mk >= s; }
  function clinicById(ctx, id) {
    var cs = ctx.settings.clinics || [];
    for (var i = 0; i < cs.length; i++) if (cs[i].id === id) return cs[i];
    return null;
  }

  /* ---------- przychód z dyżuru ---------- */
  function hasMoney(sh) { return num(sh.turnover) != null || num(sh.amount) != null || num(sh.override) != null; }
  function shiftIncome(sh, c) {
    if (!c || sh.status === 'cancelled') return 0;
    var ov = num(sh.override);
    if (ov != null) return r2(ov);

  /* ---------- agregat miesiąca ---------- */
  function monthAgg(ctx, mk, rates) {
    var md = ctx.month(mk), per = {};

  }
  function social(ctx, mk) {

    '<h4 style="margin-top:14px">Punkty edukacyjne</h4>' + prog +
    '<div class="frow" style="margin-top:8px"><label class="f">Początek okresu<input type="month" id="cme-from" data-bind="cme.from" value="' + esc(cme.from || '') + '"></label>' +
    fld('Wymagane punkty', 'cme-target', 'cme.target', target, { num: 1 }) + fld('Długość okresu (mies.)', 'cme-months', 'cme.months', months, { num: 1 }) + '</div>' +
    '<p class="small muted" style="margin-top:6px">Lekarz dentysta: 200 pkt w każdym 48-miesięcznym okresie; nadwyżka nie przechodzi na kolejny (rozporządzenie MZ z 21.02.2022, Dz.U. 2022 poz. 464). Zachowuj zaświadczenia z kursów.</p></div>';
}

/* ---------- okno kursu ---------- */
function newCourse(d) {
  var t = todayStr(), from = /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d : (UI.tab === 'cal' && UI.sheet && UI.sel ? UI.sel : t);
  return { id: null, name: '', kind: 'hands', place: '', from: from, to: from, start: '', end: '', block: true, blockTouched: false,
    cost: '', paid: from < t ? from : t, firm: true, points: '', note: '', more: false };
}
function draftOf(k) {
  return { id: k.id, name: k.name || '', kind: k.kind || 'other', place: k.place || '', from: k.from, to: courseEnd(k), start: k.start || '', end: k.end || '',
    block: k.block !== false, blockTouched: true, cost: inputNum(k.cost), paid: k.paid || k.from, firm: k.firm !== false, points: inputNum(k.points), note: k.note || '',
    more: !!(num(k.cost) || num(k.points) || k.note) };
}
function courseHtml() {
  var k = UI.course, t = todayStr(), valid = /^\d{4}-\d{2}-\d{2}$/.test(k.from || ''), to = valid && k.to >= k.from ? k.to : k.from;
  var kinds = '<div class="preset-row" role="group" aria-label="Typ kursu">' + E.COURSE_KINDS.map(function (x) {
    return '<button type="button" class="pchip" data-a="cr-kind" data-v="' + x[0] + '" aria-pressed="' + (k.kind === x[0]) + '">' + x[1] + '</button>';
  }).join('') + '</div>';
  var auto = 0, manual = 0;
  if (k.block && valid) for (var d = k.from, n = 0; d <= to && n < 62; d = addDays(d, 1), n++) {
    M(mkOf(d)).shifts.forEach(function (s) {
      if (s.date !== d || s.status !== 'planned') return;
      if (s.auto && !hasMoney(s) && d >= t) auto++; else manual++;
    });
  }
  var impact = !k.block ? '<p class="small muted">Dyżury w tych dniach zostają – np. webinar wieczorem po pracy.</p>'
    : (auto || manual) ? '<p class="small">' + (auto ? 'Zdejmę z kalendarza <b>' + auto + '</b> ' + plural(auto, 'dyżur', 'dyżury', 'dyżurów') + ' z dni pracy. ' : '') +
      (manual ? '<span style="color:var(--warn-text)"><b>' + manual + '</b> ' + plural(manual, 'dyżur dodany ręcznie zostaje', 'dyżury dodane ręcznie zostają', 'dyżurów dodanych ręcznie zostaje') + ' – odwołaj albo przesuń ' + (manual === 1 ? 'go' : 'je') + ' sam.</span>' : '') + '</p>'
    : '<p class="small muted">W tych dniach grafik nie wpisze dyżurów – jak przy urlopie.</p>';
  var py = +((k.paid || k.from || t).slice(0, 4)), reg = E.regimeFor(CTX, py);
  var costHint = reg === 'ryczalt' ? 'w ' + py + ' jesteś na ryczałcie: koszt nie obniży podatku, tylko Twoje netto' : 'na skali ' + py + ' koszt obniży podatek i zdrowotną (potwierdź z księgową)';
  var del = !k.id ? '' : UI.ask === 'course-del'
    ? '<span class="confirm">Usunąć kurs' + (num(k.cost) && k.firm ? ' i jego koszt' : '') + '? <button type="button" class="btn sm danger" data-a="course-del">Usuń</button><button type="button" class="btn sm" data-a="ask-cancel">Anuluj</button></span>'
    : '<button type="button" class="btn ghost danger" data-a="course-del-ask" style="margin-left:auto">Usuń kurs</button>';
  return '<div class="modal-wrap" data-a="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="crTitle"><div class="modal-h"><h3 id="crTitle">' + (k.id ? 'Edytuj kurs' : 'Nowy kurs') + '</h3><button class="icon-btn" data-a="modal-close" aria-label="Zamknij">×</button></div>' +
    '<form id="courseForm" class="stack cform" novalidate>' +
    '<label class="f">Nazwa kursu<input type="text" id="cr-name" data-cr="name" value="' + esc(k.name) + '" maxlength="90" placeholder="np. Augmentacja tkanek miękkich wokół implantów" autocomplete="off"></label>' +
    '<div><span class="f-lbl">Typ</span>' + kinds + '</div>' +
    '<label class="f">Miejsce<input type="text" id="cr-place" data-cr="place" value="' + esc(k.place) + '" maxlength="120" placeholder="np. Warszawa, centrum szkoleniowe / online" autocomplete="off"></label>' +
    '<div class="frow bottom"><label class="f">Od<input type="date" id="cr-from" data-cr="from" value="' + esc(k.from || '') + '"></label><label class="f">Do<input type="date" id="cr-to" data-cr="to" value="' + esc(k.to || '') + '" min="' + esc(k.from || '') + '"></label>' +
    '<label class="f">Godz. od<input type="time" id="cr-start" data-cr="start" value="' + esc(k.start) + '"></label><label class="f">Godz. do<input type="time" id="cr-end" data-cr="end" value="' + esc(k.end) + '"></label></div>' +
    '<p class="small muted" style="margin-top:-6px">Godziny są opcjonalne – z nimi kurs pojawi się w siatce tygodnia, bez nich jako pasek „cały dzień”.</p>' +
    '<label class="chk"><input type="checkbox" id="cr-block" data-cr="block"' + (k.block ? ' checked' : '') + '> Zajmuje cały dzień – bez dyżurów w tych dniach</label>' + impact +
    '<details class="more" data-crmore="1"' + (k.more ? ' open' : '') + '><summary>Koszt, punkty edukacyjne, notatka</summary><div class="stack" style="gap:10px">' +
    '<div class="frow"><label class="f">Koszt kursu (zł)<input type="text" inputmode="decimal" id="cr-cost" data-cr="cost" value="' + esc(k.cost) + '" placeholder="np. 3 500"></label>' +
    '<label class="f">Zapłacono<input type="date" id="cr-paid" data-cr="paid" value="' + esc(k.paid || '') + '"></label>' +
    '<label class="f">Punkty edukacyjne<input type="text" inputmode="numeric" id="cr-points" data-cr="points" value="' + esc(k.points) + '" placeholder="np. 20"></label></div>' +
    '<label class="chk"><input type="checkbox" id="cr-firm" data-cr="firm"' + (k.firm ? ' checked' : '') + '> Płacę z firmy – dopisz do kosztów firmowych</label><p class="small muted cost-hint">' + cap(costHint) + '</p>' +
    '<label class="f">Notatka / link<textarea id="cr-note" data-cr="note" rows="2" maxlength="600" placeholder="np. link do programu, co zabrać, kontakt do organizatora">' + esc(k.note) + '</textarea></label></div></details>' +
    '<div class="row"><button type="submit" class="btn primary">' + (k.id ? 'Zapisz zmiany' : 'Dodaj kurs') + '</button><button type="button" class="btn" data-a="modal-close">Anuluj</button>' + del + '</div></form></div></div>';
}

/* ---------- zapis ---------- */
function removeCourseCost(id) {
  var cid = 'kc-' + id;
  CTX.allMonths().forEach(function (p) {
    var b = p[1].costs.length;
    p[1].costs = p[1].costs.filter(function (x) { return x.id !== cid; });
    if (p[1].costs.length !== b) saveMonth(p[0]);
  });
}
function syncCourseCost(k) {
  removeCourseCost(k.id);
  if (!(num(k.cost) > 0) || k.firm === false) return;
  var date = k.paid || k.from;
  M(mkOf(date), true).costs.push({ id: 'kc-' + k.id, date: date, amount: num(k.cost), desc: 'Kurs: ' + courseTitle(k), kup: true, course: k.id });
  saveMonth(mkOf(date));
}
/* stare dni „Kurs” (bez szczegółów) → kursy; kolejne dni łączę w jeden kurs */
function migrateCourses() {
  var days = [];
  CTX.allMonths().forEach(function (p) { Object.keys(p[1].off || {}).forEach(function (d) { if (p[1].off[d] && p[1].off[d].type === 'kurs') days.push(d); }); });
  if (!days.length) return false;
  days.sort();
  var groups = [], cur = null;
  days.forEach(function (d) { if (cur && addDays(cur.to, 1) === d) cur.to = d; else { cur = { from: d, to: d }; groups.push(cur); } });
  var list = courseDoc(true).list;
  groups.forEach(function (g) { list.push({ id: 'k' + uid(), name: '', kind: 'other', place: '', from: g.from, to: g.to, block: true }); });
  var mks = {};
  days.forEach(function (d) { delete M(mkOf(d), true).off[d]; mks[mkOf(d)] = 1; });
  Object.keys(mks).forEach(saveMonth);
  saveCourses();
  return true;
}
Object.assign(ACT, {
  'course-new': function (el) {
    UI.course = newCourse(el && el.dataset ? el.dataset.d : null); UI.modal = 'course'; UI.ask = null; renderModal();
    setTimeout(function () { var n = document.getElementById('cr-name'); if (n) try { n.focus({ preventScroll: true }); } catch (e) { } }, 40);
  },
  'course-edit': function (el) {
    var k = courses().filter(function (x) { return x.id === el.dataset.id; })[0]; if (!k) return;
    UI.course = draftOf(k); UI.modal = 'course'; UI.ask = null; renderModal();
  },
  'cr-kind': function (el) {
    var k = UI.course; k.kind = el.dataset.v;
    if (!k.blockTouched) k.block = k.kind !== 'online';
    renderModal();
  },
  'course-del-ask': function () { UI.ask = 'course-del'; renderModal(); },
  'course-del': function () {
    var k = UI.course; if (!k || !k.id) return;
    var doc = courseDoc(true); doc.list = doc.list.filter(function (x) { return x.id !== k.id; });
    saveCourses(); removeCourseCost(k.id);
    var r = syncAuto();
    UI.modal = null; UI.course = null; UI.ask = null; renderModal(); render();
    toast('Usunięto kurs' + (r.added ? ' · wróciło ' + r.added + ' ' + plural(r.added, 'dyżur', 'dyżury', 'dyżurów') + ' z dni pracy' : ''));
  },
  'course-save': function () {
    var k = UI.course; if (!k) return;
    var from = k.from, to = k.to;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(from || '')) return toast('Wpisz datę rozpoczęcia kursu');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(to || '')) to = from;
    if (to < from) return toast('Data „do” jest przed „od”');
    if (daysBetween(from, to) > 60) return toast('Najwyżej 61 dni – dłuższy kurs wpisz jako kolejne zjazdy');
    if (!!k.start !== !!k.end) return toast('Wpisz obie godziny albo żadnej');
    var obj = { id: k.id || 'k' + uid(), name: (k.name || '').trim(), kind: k.kind || 'other', place: (k.place || '').trim(), from: from, to: to, block: k.block !== false };
    if (k.start && k.end) { obj.start = k.start; obj.end = k.end; }
    var cost = num(k.cost); if (cost != null && cost > 0) { obj.cost = cost; obj.paid = /^\d{4}-\d{2}-\d{2}$/.test(k.paid || '') ? k.paid : from; obj.firm = k.firm !== false; }
    var pts = num(k.points); if (pts != null && pts > 0) obj.points = pts;
    if ((k.note || '').trim()) obj.note = k.note.trim();
    var doc = courseDoc(true), i = doc.list.findIndex(function (x) { return x.id === obj.id; });
    if (i >= 0) doc.list[i] = obj; else doc.list.push(obj);
    doc.list.sort(function (a, b) { return a.from < b.from ? -1 : a.from > b.from ? 1 : 0; });
    saveCourses(); syncCourseCost(obj);
    var r = syncAuto();
    UI.modal = null; UI.course = null; UI.ask = null; renderModal();
    if (UI.tab === 'cal') { UI.sel = from; UI.mk = mkOf(from); }
    render(); stackShow(from);
    toast((i >= 0 ? 'Zapisano kurs' : 'Dodano kurs') + (r.removed ? ' · zdjęto ' + r.removed + ' ' + plural(r.removed, 'dyżur', 'dyżury', 'dyżurów') + ' z dni pracy' : '') + (r.added ? ' · wróciło ' + r.added : ''));
  }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (!UI.course || !t.dataset || !t.dataset.cr || /^(checkbox|date|time)$/.test(t.type)) return;
  UI.course[t.dataset.cr] = t.value;
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (!UI.course || !t.dataset || !t.dataset.cr) return;
  var f = t.dataset.cr, k = UI.course;
  if (t.type === 'checkbox') { k[f] = t.checked; if (f === 'block') k.blockTouched = true; afterPointer(renderModal); return; }
  var DATE = /^\d{4}-\d{2}-\d{2}$/, old = k[f];
  k[f] = t.value;
  /* przesunięcie początku przesuwa koniec – kurs zachowuje długość (jak w Kalendarzu Google) */
  if (f === 'from' && DATE.test(t.value)) k.to = addDays(t.value, DATE.test(old || '') && DATE.test(k.to || '') && k.to >= old ? daysBetween(old, k.to) : 0);
  if (/^(date|time)$/.test(t.type)) whenBlurred(t, renderModal);
});
document.addEventListener('submit', function (ev) { if (ev.target && ev.target.id === 'courseForm') { ev.preventDefault(); if (UI.loaded) ACT['course-save'](); } });
document.addEventListener('toggle', function (ev) { var t = ev.target; if (UI.course && t && t.dataset && t.dataset.crmore) UI.course.more = t.open; }, true);

/* ===== start: po wczytaniu wszystkich części ===== */
boot();

})();
</script>

</body>
</html>
